[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "data-quant-core"
version = "0.1.0"
description = "Shared contracts, data foundations, diagnostics, and orchestration for the Data-Quant skill bundle."
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
  "pydantic>=2.7",
  "PyYAML>=6.0",
  "cvxpy>=1.4",
]

[project.optional-dependencies]
io = [
  "pyarrow>=14",
  "duckdb>=1.0",
  "SQLAlchemy>=2.0",
]
ml = [
  "scikit-learn>=1.3",
  "joblib>=1.3",
]
portfolio = [
  "statsmodels>=0.14",
  "exchange-calendars>=4.5",
]
dev = [
  "build>=1.2",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "hypothesis>=6.100",
  "jsonschema>=4.22",
  "ruff>=0.5",
  "mypy>=1.10",
  "pip-tools>=7.4",
]
all = [
  "pyarrow>=14",
  "duckdb>=1.0",
  "SQLAlchemy>=2.0",
  "scikit-learn>=1.3",
  "joblib>=1.3",
  "statsmodels>=0.14",
  "exchange-calendars>=4.5",
]

[project.scripts]
quantctl = "data_quant.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.14"
warn_unused_configs = true
warn_return_any = true
no_implicit_optional = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = [
  "numpy",
  "numpy.*",
  "pandas",
  "pandas.*",
  "yaml",
  "duckdb",
  "sqlalchemy",
  "sqlalchemy.*",
  "scipy",
  "scipy.*",
  "sklearn",
  "sklearn.*",
]
ignore_missing_imports = true
follow_imports = "skip"
